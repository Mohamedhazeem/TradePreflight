# Tooling configuration only.
#
# This project is a *Hermes native plugin*, not a distributable Python
# package. It is installed by Hermes (or copied into `~/.hermes/plugins/`),
# not by `pip install`.
#
# There is deliberately no `[project]` / `[build-system]` table here: the Hermes
# plugin manager treats a directory with a `[project]` table as an installable
# workspace member named after the project, which collides with the plugin id
# (`trade-preflight`) and breaks `uv lock` / `hermes plugins enable` when more
# than one profile has the plugin enabled.
#
# Development dependencies live in `requirements-dev.txt`:
#
#   python -m pip install -r requirements-dev.txt

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["trade_preflight"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
